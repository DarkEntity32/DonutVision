name: Build DonutVision v1.9.9

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DonutVision-26.1.2
    steps:
      - name: Download project
        uses: actions/checkout@v4
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Build Minecraft mod
        run: gradle --no-daemon clean build --stacktrace
      - name: Verify JAR really contains v1.9.9 printer
        run: |
          python3 - <<'PYVERIFY'
          import glob, json, zipfile
          jars=[p for p in glob.glob('build/libs/*.jar') if not p.endswith(('-dev.jar','-sources.jar'))]
          assert len(jars)==1, 'Expected one Minecraft JAR; got: '+str(jars)
          with zipfile.ZipFile(jars[0]) as z:
              names=set(z.namelist())
              required={'fabric.mod.json', 'dev/donutvision/SchematicAssist.class', 'dev/donutvision/DonutVisionClient.class', 'dev/donutvision/DonutVisionScreen.class'}
              assert required.issubset(names), 'Missing classes: '+str(required-names)
              info=json.loads(z.read('fabric.mod.json'))
              assert info['version']=='1.9.9', 'Wrong version: '+str(info['version'])
          print('PASS: verified actual v1.9.9 mod includes SchematicAssist:',jars[0])
          PYVERIFY
      - name: Upload verified v1.9.9 JAR
        uses: actions/upload-artifact@v4
        with:
          name: DonutVision-v1.9.9-JAR
          path: DonutVision-26.1.2/build/libs/donutvision-26.1.2-1.9.9.jar
          if-no-files-found: error
